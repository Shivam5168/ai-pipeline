version: 0.2

env:
  variables:
    S3_BUCKET: "my-target-s3-bucket-name"
  secrets-manager:
    # Store your free Gemini API key in AWS Secrets Manager or Parameter Store
    GEMINI_API_KEY: "my-gemini-api-key"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install google-genai
  pre_build:
    commands:
      - echo "Running AI validation checks with Gemini..."
      - python ai_inspector.py
  build:
    commands:
      - echo "AI checks passed. Syncing files to Amazon S3..."
      - aws s3 sync . s3://$S3_BUCKET/ --exclude ".git/*" --exclude "buildspec.yml" --exclude "ai_inspector.py"
  post_build:
    commands:
      - echo "Deployment to S3 completed successfully."
